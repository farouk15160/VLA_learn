[pytest]
testpaths = tests
# ROS puts /opt/ros/*/site-packages on PYTHONPATH, and its `launch_testing`
# pytest plugin is autoloaded into every pytest run on this machine, where it
# breaks collection before a single test is imported. Disabling it here keeps
# `pytest` working from a bare invocation (including from git hooks) without
# needing PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 on the command line.
# (the entry-point names are `launch_testing` and `launch_ros`, not the
# module names -- `-p no:` matches the entry point.)
addopts = -p no:launch_testing -p no:launch_ros
